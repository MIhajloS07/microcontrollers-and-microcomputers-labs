<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 820 270" width="820" height="270" role="img"><style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
.g{fill:#8b949e}.t{fill:#2dd4bf}.b{fill:#58a6ff}.p{fill:#f0506e}.y{fill:#f2cc60}
</style><defs></defs><rect width="820" height="270" rx="14" fill="#0d1117"/><text x="410.0" y="30" text-anchor="middle" font-size="18" font-weight="700">PIR motion detection → camera</text><text class="g" x="410.0" y="50" text-anchor="middle" font-size="12">HC-SR501 senses changes in infrared radiation (8–14 µm) emitted by a warm body</text><polygon points="82,150 620,92 620,200" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".5" stroke-dasharray="5 5"/><line x1="20" y1="200" x2="800" y2="200" stroke="#30363d" stroke-width="2"/><rect x="42" y="164" width="40" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="62" cy="152" r="22" fill="#e6edf3" fill-opacity=".9"/><text class="g" x="62" y="226" text-anchor="middle" font-size="12">HC-SR501</text><text class="g" x="62" y="244" text-anchor="middle" font-size="11">GPIO17</text><g opacity="1"><animateTransform attributeName="transform" type="translate" values="780,172;170,172" dur="8s" repeatCount="indefinite"/><circle cx="0" cy="-30" r="8" fill="#f2cc60"/><line x1="0" y1="-22" x2="0" y2="0" stroke="#f2cc60" stroke-width="4" stroke-linecap="round"/><line x1="-11" y1="-14" x2="11" y2="-14" stroke="#f2cc60" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="0" x2="-9" y2="20" stroke="#f2cc60" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="0" x2="9" y2="20" stroke="#f2cc60" stroke-width="4" stroke-linecap="round"/></g><text class="m g" x="440" y="80" text-anchor="middle" font-size="16" opacity="1">waiting… GPIO17 = 0<animate attributeName="opacity" calcMode="discrete" values="1;0;1" keyTimes="0;.262;.97" dur="8s" repeatCount="indefinite"/></text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;.262;.97" dur="8s" repeatCount="indefinite"/><text class="p" x="440" y="80" text-anchor="middle" font-size="19" font-weight="800">MOTION DETECTED</text><text class="m t" x="440" y="100" text-anchor="middle" font-size="13">PIR out HIGH → GPIO17 = 1 → photo + 10 s video</text></g><rect x="690" y="110" width="44" height="30" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="2"/><circle cx="712" cy="125" r="8" fill="#0d1117" stroke="#8b949e" stroke-width="2"/><circle cx="712" cy="125" r="18" fill="#e6edf3" opacity="0"><animate attributeName="opacity" values="0;0;.95;0;0" keyTimes="0;.27;.285;.33;1" dur="8s" repeatCount="indefinite"/></circle><text class="g" x="712" y="158" text-anchor="middle" font-size="12">camera</text></svg>