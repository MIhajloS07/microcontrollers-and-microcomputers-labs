</style><defs><radialGradient id="glow"><stop offset="0" stop-color="#f0506e" stop-opacity=".95"/><stop offset="1" stop-color="#f0506e" stop-opacity="0"/></radialGradient></defs><rect width="640" height="240" rx="14" fill="#0d1117"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="700">GPIO output — blinking an LED</text><text class="g" x="320.0" y="50" text-anchor="middle" font-size="12">scriptRPi_01.py · GPIO.output(18, HIGH / LOW) every second</text><rect x="30" y="80" width="120" height="130" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="90" y="110" text-anchor="middle" font-size="15" font-weight="700" style="fill:#f0506e">Raspberry Pi</text><text class="m y" x="140" y="150" text-anchor="end" font-size="13">GPIO18</text><circle cx="150" cy="146" r="5" fill="#f2cc60"/><path d="M155,146 H230 M314,146 H380 M420,146 H520 V196" fill="none" stroke="#8b949e" stroke-width="3"/><path d="M230,146 l10,-14 l16,28 l16,-28 l16,28 l16,-28 l10,14" fill="none" stroke="#e6edf3" stroke-width="3"/><polygon points="380,122 380,170 420,146" fill="#161b22" stroke="#e6edf3" stroke-width="3"/><line x1="420" y1="122" x2="420" y2="170" stroke="#e6edf3" stroke-width="3"/><line x1="504" y1="196" x2="536" y2="196" stroke="#e6edf3" stroke-width="3"/><line x1="510" y1="203" x2="530" y2="203" stroke="#e6edf3" stroke-width="3"/><line x1="516" y1="210" x2="524" y2="210" stroke="#e6edf3" stroke-width="3"/><circle cx="400" cy="146" r="50" fill="url(#glow)" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;.5" dur="2s" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;.5" dur="2s" repeatCount="indefinite"/><circle r="3.5" fill="#f2cc60"><animateMotion path="M155,146 H520 V196" dur="1s" repeatCount="indefinite"/></circle><circle r="3.5" fill="#f2cc60"><animateMotion path="M155,146 H520 V196" dur="1s" begin=".33s" repeatCount="indefinite"/></